# Name your project! Project names should contain only lowercase characters
# and underscores.
name: 'my_new_project'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

# Paths
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# =========================
# MODEL CONFIGURATIONS
# =========================
models:
  my_new_project:
    mart:
      +materialized: table
      finance:
        +schema: finance